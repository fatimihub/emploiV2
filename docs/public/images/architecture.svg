<svg width="800" height="400" viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg">
  <rect x="10" y="10" width="780" height="380" rx="10" fill="#f8f9fa" stroke="#dee2e6" stroke-width="2"/>
  
  <!-- Client Side -->
  <rect x="50" y="80" width="200" height="240" rx="5" fill="#e7f5ff" stroke="#339af0" stroke-width="2"/>
  <text x="150" y="110" text-anchor="middle" font-family="Arial" font-size="16" font-weight="bold" fill="#1864ab">Frontend (React)</text>
  <text x="150" y="150" text-anchor="middle" font-family="Arial" font-size="12" fill="#495057">UI Components</text>
  <text x="150" y="180" text-anchor="middle" font-family="Arial" font-size="12" fill="#495057">State Management</text>
  <text x="150" y="210" text-anchor="middle" font-family="Arial" font-size="12" fill="#495057">Electron Renderer</text>
  
  <!-- Server Side -->
  <rect x="350" y="80" width="200" height="240" rx="5" fill="#f3f0ff" stroke="#7950f2" stroke-width="2"/>
  <text x="450" y="110" text-anchor="middle" font-family="Arial" font-size="16" font-weight="bold" fill="#5f3dc4">Backend (Node.js)</text>
  <text x="450" y="150" text-anchor="middle" font-family="Arial" font-size="12" fill="#495057">Express API</text>
  <text x="450" y="180" text-anchor="middle" font-family="Arial" font-size="12" fill="#495057">Generation Engine</text>
  <text x="450" y="210" text-anchor="middle" font-family="Arial" font-size="12" fill="#495057">Sequelize ORM</text>
  
  <!-- Database -->
  <path d="M700 80 C740 80, 740 120, 700 120 C660 120, 660 80, 700 80 Z" fill="#fff4e6" stroke="#fd7e14" stroke-width="2"/>
  <rect x="660" y="100" width="80" height="150" rx="5" fill="#fff4e6" stroke="#fd7e14" stroke-width="2"/>
  <text x="700" y="140" text-anchor="middle" font-family="Arial" font-size="16" font-weight="bold" fill="#d9480f">SQLite</text>
  <text x="700" y="180" text-anchor="middle" font-family="Arial" font-size="12" fill="#495057">Local DB</text>

  <!-- Arrows -->
  <line x1="250" y1="200" x2="350" y2="200" stroke="#adb5bd" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="550" y1="200" x2="660" y2="200" stroke="#adb5bd" stroke-width="2" marker-end="url(#arrowhead)"/>

  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="0" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#adb5bd" />
    </marker>
  </defs>
</svg>
