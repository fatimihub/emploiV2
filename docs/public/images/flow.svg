<svg width="800" height="400" viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg">
  <rect x="10" y="10" width="780" height="380" rx="10" fill="#f1f3f5" stroke="#ced4da" stroke-width="2"/>
  
  <!-- Steps -->
  <rect x="50" y="150" width="120" height="80" rx="5" fill="#fab005" stroke="#f59f00" stroke-width="2"/>
  <text x="110" y="185" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold" fill="#ffffff">Configuration</text>
  <text x="110" y="205" text-anchor="middle" font-family="Arial" font-size="11" fill="#ffffff">Données de base</text>
  
  <rect x="250" y="150" width="120" height="80" rx="5" fill="#40c057" stroke="#37b24d" stroke-width="2"/>
  <text x="310" y="185" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold" fill="#ffffff">Analyse</text>
  <text x="310" y="205" text-anchor="middle" font-family="Arial" font-size="11" fill="#ffffff">Gestion Conflits</text>
  
  <rect x="450" y="150" width="120" height="80" rx="5" fill="#228be6" stroke="#1c7ed6" stroke-width="2"/>
  <text x="510" y="185" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold" fill="#ffffff">Génération</text>
  <text x="510" y="205" text-anchor="middle" font-family="Arial" font-size="11" fill="#ffffff">Algorithme</text>
  
  <rect x="650" y="150" width="120" height="80" rx="5" fill="#be4bdb" stroke="#ae3ec9" stroke-width="2"/>
  <text x="710" y="185" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold" fill="#ffffff">Diffusion</text>
  <text x="710" y="205" text-anchor="middle" font-family="Arial" font-size="11" fill="#ffffff">Export PNG/ZIP</text>

  <!-- Arrows -->
  <line x1="170" y1="190" x2="250" y2="190" stroke="#adb5bd" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="370" y1="190" x2="450" y2="190" stroke="#adb5bd" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="570" y1="190" x2="650" y2="190" stroke="#adb5bd" stroke-width="2" marker-end="url(#arrowhead)"/>

  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="0" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#adb5bd" />
    </marker>
  </defs>
</svg>
